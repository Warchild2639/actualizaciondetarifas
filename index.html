<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizacion de Tarifas</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#f0f2f5;padding:15px 15px 90px;text-align:center;-webkit-user-select:none;user-select:none}
h1{margin-bottom:15px;font-size:1.5rem;color:#333}
#estado-conexion{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;margin-bottom:15px;padding:5px 10px;border-radius:20px;background:#e9ecef;color:#555}
#estado-conexion .punto{width:9px;height:9px;border-radius:50%;background:#999}
#estado-conexion.conectado{background:#d4edda;color:#155724}
#estado-conexion.conectado .punto{background:#28a745}
#estado-conexion.desconectado{background:#fff3cd;color:#856404}
#estado-conexion.desconectado .punto{background:#ffc107}
.menu-lineas{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-bottom:18px}
.btn-linea{background:#007bff;color:white;border:none;padding:12px;font-size:1rem;font-weight:bold;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-linea.activo{background:#0056b3;box-shadow:inset 0 0 5px rgba(0,0,0,.5)}
#panel-progreso{background:white;border-radius:12px;padding:16px;margin:0 auto 20px;max-width:720px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:left}
#panel-progreso h2{text-align:center;font-size:1.05rem;color:#333;margin-bottom:14px}
.progreso-general{text-align:center;margin-bottom:18px}
.progreso-general .porcentaje{font-size:2rem;font-weight:bold;color:#007bff;line-height:1.1}
.progreso-general .detalle{color:#666;font-size:.8rem;margin-top:4px}
.barra-general{height:10px;background:#e9ecef;border-radius:10px;overflow:hidden;margin-top:10px}
.barra-general .relleno{height:100%;width:0%;background:#007bff;border-radius:10px;transition:width .35s ease}
.lista-progreso{display:flex;flex-direction:column;gap:10px}
.fila-progreso{display:grid;grid-template-columns:55px 1fr 58px;align-items:center;gap:8px}
.nombre-linea{font-weight:bold;font-size:.85rem;color:#333;text-align:left}
.barra-linea{height:12px;background:#e9ecef;border-radius:10px;overflow:hidden}
.barra-linea .relleno{height:100%;width:0%;background:#28a745;border-radius:10px;transition:width .35s ease}
.valor-progreso{font-size:.8rem;font-weight:bold;color:#555;text-align:right}
.sin-datos{color:#888;font-size:.8rem;text-align:center;padding:8px}
.contenedor-internos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.interno{background:white;border:2px solid #ccc;border-radius:8px;padding:15px 5px;font-size:1.1rem;font-weight:bold;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:70px;box-shadow:0 2px 4px rgba(0,0,0,.05);-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.interno.descargado{background:#28a745!important;color:white;border-color:#1e7e34}
.interno.con-mensaje{background:#f59d00!important;color:white;border-color:#d47f00}
.interno.descargado.con-mensaje{background:#f59d00!important;border-color:#d47f00}
.nota-indicador{font-size:.65rem;color:#666;font-weight:normal;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.interno.descargado .nota-indicador{color:#e2fcd4}
.interno.con-mensaje .nota-indicador{color:white;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mensaje-estado{color:#666;font-style:italic;margin-top:20px;grid-column:span 4}
#boton-volver{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:#007bff;color:white;font-size:30px;line-height:56px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:1000;display:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .15s}
#boton-volver:active{transform:scale(.9);background:#0056b3}
@media(max-width:360px){.contenedor-internos{grid-template-columns:repeat(3,1fr)}.mensaje-estado{grid-column:span 3}.fila-progreso{grid-template-columns:48px 1fr 52px;gap:6px}.valor-progreso{font-size:.75rem}}
</style>
</head>
<body>
<h1 id="titulo-vista">Seleccione una Línea</h1>
<div id="estado-conexion" class="desconectado"><span class="punto"></span><span id="texto-conexion">Conectando...</span></div>
<div class="menu-lineas">
<button class="btn-linea" onclick="cargarLinea('271',this)">271</button>
<button class="btn-linea" onclick="cargarLinea('373',this)">373</button>
<button class="btn-linea" onclick="cargarLinea('384',this)">384</button>
<button class="btn-linea" onclick="cargarLinea('177',this)">177</button>
<button class="btn-linea" onclick="cargarLinea('263',this)">263</button>
<button class="btn-linea" onclick="cargarLinea('79',this)">79</button>
<button class="btn-linea" onclick="cargarLinea('514',this)">514</button>
<button class="btn-linea" onclick="cargarLinea('varela',this)">Varela</button>
</div>
<div id="panel-progreso">
<h2>Progreso de actualización</h2>
<div class="progreso-general">
<div class="porcentaje" id="progreso-general-porcentaje">0%</div>
<div class="detalle" id="progreso-general-detalle">Calculando...</div>
<div class="barra-general"><div class="relleno" id="barra-general-relleno"></div></div>
</div>
<div class="lista-progreso" id="lista-progreso"><div class="sin-datos">Calculando progreso de las líneas...</div></div>
</div>
<div class="contenedor-internos" id="panel-internos"><div class="mensaje-estado">Ninguna línea seleccionada</div></div>
<button id="boton-volver" onclick="volverAlMenu()" aria-label="Volver">←</button>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBdYu1yjsshw0lXXQ9PRlN-hPEHB6tjNF4",authDomain:"tarifas-compartidas.firebaseapp.com",databaseURL:"https://tarifas-compartidas-default-rtdb.firebaseio.com",projectId:"tarifas-compartidas",storageBucket:"tarifas-compartidas.firebasestorage.app",messagingSenderId:"943166246045",appId:"1:943166246045:web:f0df71d42acf52ebf15874",measurementId:"G-TXK4ZW38ZK"};
firebase.initializeApp(firebaseConfig);const database=firebase.database();let referenciaEstados=null;let lineaActual=null;
const lineasProgreso=['271','373','384','177','263','79','514','varela'];
const nombresLineas={'271':'271','373':'373','384':'384','177':'177','263':'263','79':'79','514':'514','varela':'Varela'};
const datosProgreso={};const referenciasProgreso={};
const referenciaConexion=database.ref('.info/connected');
referenciaConexion.on('value',snapshot=>{const conectado=snapshot.val()===true;const indicador=document.getElementById('estado-conexion');const texto=document.getElementById('texto-conexion');if(conectado){indicador.classList.remove('desconectado');indicador.classList.add('conectado');texto.innerText='Conectado'}else{indicador.classList.remove('conectado');indicador.classList.add('desconectado');texto.innerText='Sin conexión'}});
function iniciarProgreso(){const lista=document.getElementById('lista-progreso');lista.innerHTML='';lineasProgreso.forEach(linea=>{datosProgreso[linea]={total:0,completados:0,listaCargada:false};const fila=document.createElement('div');fila.className='fila-progreso';fila.id=`progreso-${linea}`;fila.innerHTML=`<div class="nombre-linea">${nombresLineas[linea]}</div><div class="barra-linea"><div class="relleno"></div></div><div class="valor-progreso">0%</div>`;lista.appendChild(fila);fetch(`lineas/${linea}.txt`).then(response=>{if(!response.ok)throw new Error(`No se encontró lineas/${linea}.txt`);return response.text()}).then(texto=>{const internos=texto.split('\n').map(valor=>valor.trim()).filter(valor=>valor.length>0);datosProgreso[linea].total=internos.length;datosProgreso[linea].listaCargada=true;actualizarProgresoLinea(linea);actualizarProgresoGeneral()}).catch(error=>{console.error(`Error cargando progreso de ${linea}:`,error);datosProgreso[linea].listaCargada=true;actualizarProgresoLinea(linea);actualizarProgresoGeneral()});referenciasProgreso[linea]=database.ref(`estados/${linea}`);referenciasProgreso[linea].on('value',snapshot=>{const estados=snapshot.val()||{};datosProgreso[linea].completados=Object.values(estados).filter(estado=>estado&&estado.descargado===true).length;actualizarProgresoLinea(linea);actualizarProgresoGeneral()})})}
function actualizarProgresoLinea(linea){const datos=datosProgreso[linea];const fila=document.getElementById(`progreso-${linea}`);if(!fila||!datos||!datos.listaCargada)return;const porcentaje=datos.total>0?Math.round(datos.completados/datos.total*100):0;const porcentajeLimitado=Math.min(100,porcentaje);fila.querySelector('.relleno').style.width=`${porcentajeLimitado}%`;fila.querySelector('.valor-progreso').textContent=`${porcentajeLimitado}%`;fila.title=`${datos.completados} de ${datos.total} internos actualizados`}
function actualizarProgresoGeneral(){let total=0;let completados=0;let listasCargadas=0;lineasProgreso.forEach(linea=>{const datos=datosProgreso[linea];if(!datos)return;if(datos.listaCargada)listasCargadas++;total+=datos.total;completados+=Math.min(datos.completados,datos.total)});if(listasCargadas<lineasProgreso.length){document.getElementById('progreso-general-detalle').textContent='Calculando líneas...';return}const porcentaje=total>0?Math.round(completados/total*100):0;document.getElementById('progreso-general-porcentaje').textContent=`${porcentaje}%`;document.getElementById('progreso-general-detalle').textContent=`${completados} de ${total} internos actualizados`;document.getElementById('barra-general-relleno').style.width=`${Math.min(100,porcentaje)}%`}
function cargarLinea(linea,botonElemento){lineaActual=linea;localStorage.setItem('ultimaLinea',linea);document.getElementById('titulo-vista').innerText=`Cargando Línea ${linea.toUpperCase()}...`;document.querySelectorAll('.btn-linea').forEach(btn=>btn.classList.remove('activo'));botonElemento.classList.add('activo');document.getElementById('boton-volver').style.display='block';document.getElementById('panel-progreso').style.display='none';const contenedor=document.getElementById('panel-internos');contenedor.innerHTML=`<div class="mensaje-estado">Buscando archivo lineas/${linea}.txt...</div>`;if(referenciaEstados){referenciaEstados.off();referenciaEstados=null}fetch(`lineas/${linea}.txt`).then(response=>{if(!response.ok)throw new Error(`No se encontró el archivo de la línea ${linea}`);return response.text()}).then(texto=>{document.getElementById('titulo-vista').innerText=`Línea ${linea.toUpperCase()}`;contenedor.innerHTML='';const internos=texto.split('\n').map(valor=>valor.trim()).filter(valor=>valor.length>0);if(internos.length===0){contenedor.innerHTML=`<div class="mensaje-estado">El archivo de la línea ${linea} está vacío.</div>`;return}internos.forEach(num=>{const div=document.createElement('div');div.className='interno';div.setAttribute('data-interno',num);div.innerHTML=`<span>${num}</span><div class="nota-indicador"></div>`;configurarEventosToque(div,linea,num);contenedor.appendChild(div)});referenciaEstados=database.ref(`estados/${linea}`);referenciaEstados.on('value',snapshot=>{const estados=snapshot.val()||{};internos.forEach(num=>{const elemento=contenedor.querySelector(`.interno[data-interno="${CSS.escape(num)}"]`);if(!elemento)return;const estado=estados[num]||{descargado:false,nota:""};const mensaje=(estado.nota||'').trim();elemento.classList.toggle('descargado',!!estado.descargado);elemento.classList.toggle('con-mensaje',!!mensaje);elemento.querySelector('.nota-indicador').textContent=mensaje})},error=>console.error('Error Firebase:',error))}).catch(error=>{document.getElementById('titulo-vista').innerText='Error';contenedor.innerHTML=`<div class="mensaje-estado" style="color:red;">⚠️ Error al cargar la línea ${linea}.<br><br>Asegurate de que exista en la carpeta "lineas".</div>`;console.error(error)})}
function configurarEventosToque(elemento,linea,interno){let tiempoPresionado;let ultimoTap=0;let dobleTapBloqueado=false;elemento.addEventListener('touchstart',()=>{tiempoPresionado=setTimeout(()=>alternarDescarga(linea,interno),600)},{passive:true});elemento.addEventListener('touchmove',()=>clearTimeout(tiempoPresionado),{passive:true});elemento.addEventListener('touchend',e=>{clearTimeout(tiempoPresionado);const ahora=Date.now();if(ahora-ultimoTap<350){e.preventDefault();dobleTapBloqueado=true;ultimoTap=0;editarMensaje(linea,interno);setTimeout(()=>dobleTapBloqueado=false,50)}else ultimoTap=ahora},{passive:false});elemento.addEventListener('touchcancel',()=>clearTimeout(tiempoPresionado),{passive:true});elemento.addEventListener('dblclick',e=>{e.preventDefault();editarMensaje(linea,interno)});elemento.addEventListener('click',e=>e.preventDefault())}
function editarMensaje(linea,interno){const referencia=database.ref(`estados/${linea}/${interno}`);referencia.once('value').then(snapshot=>{const estado=snapshot.val()||{descargado:false,nota:""};const mensaje=prompt(`Mensaje para el interno ${interno}:`,estado.nota||'');if(mensaje===null)return;const texto=mensaje.trim();return referencia.transaction(estadoActual=>{const actual=estadoActual||{descargado:false,nota:""};return{descargado:!!actual.descargado,nota:texto}})}).then(resultado=>{if(resultado)console.log(`Mensaje del interno ${interno} actualizado`)}).catch(error=>{console.error('Error guardando mensaje:',error);alert('No se pudo guardar el mensaje.')})}
function alternarDescarga(linea,interno){const referencia=database.ref(`estados/${linea}/${interno}`);referencia.transaction(estadoActual=>{const estado=estadoActual||{descargado:false,nota:""};return{descargado:!estado.descargado,nota:estado.nota||""}}).then(()=>console.log(`Interno ${interno} actualizado`)).catch(error=>{console.error('Error guardando:',error);alert('No se pudo guardar el cambio.')})}
function volverAlMenu(){if(referenciaEstados){referenciaEstados.off();referenciaEstados=null}lineaActual=null;localStorage.removeItem('ultimaLinea');document.getElementById('titulo-vista').innerText='Seleccione una Línea';document.querySelectorAll('.btn-linea').forEach(btn=>btn.classList.remove('activo'));document.getElementById('panel-internos').innerHTML='<div class="mensaje-estado">Ninguna línea seleccionada</div>';document.getElementById('panel-progreso').style.display='block';document.getElementById('boton-volver').style.display='none'}
window.addEventListener('load',()=>{iniciarProgreso();const ultimaLinea=localStorage.getItem('ultimaLinea');if(!ultimaLinea)return;const boton=Array.from(document.querySelectorAll('.btn-linea')).find(btn=>btn.innerText.trim().toLowerCase()===ultimaLinea.toLowerCase());if(boton)cargarLinea(ultimaLinea,boton)})
</script>
</body>
</html>
