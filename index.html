*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#f0f2f5;padding:15px 15px 90px;text-align:center;-webkit-user-select:none;user-select:none}
h1{margin-bottom:15px;font-size:1.5rem;color:#333}
#estado-conexion{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;margin-bottom:15px;padding:5px 10px;border-radius:20px;background:#e9ecef;color:#555}
#estado-conexion .punto{width:9px;height:9px;border-radius:50%;background:#999}
#estado-conexion.conectado{background:#d4edda;color:#155724}
#estado-conexion.conectado .punto{background:#28a745}
#estado-conexion.desconectado{background:#fff3cd;color:#856404}
#estado-conexion.desconectado .punto{background:#ffc107}
.menu-lineas{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-bottom:18px}
.btn-linea{background:#007bff;color:white;border:none;padding:12px;font-size:1rem;font-weight:bold;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-linea.bloqueada{background:#777;color:#fff;box-shadow:inset 0 0 0 2px #555}.btn-linea.activo{background:#0056b3;box-shadow:inset 0 0 5px rgba(0,0,0,.5)}
#panel-progreso{background:white;border-radius:12px;padding:16px;margin:0 auto 20px;max-width:720px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:left}
#panel-progreso h2{text-align:center;font-size:1.05rem;color:#333;margin-bottom:14px}
.progreso-general{text-align:center;margin-bottom:18px}
.progreso-general .porcentaje{font-size:2rem;font-weight:bold;color:#007bff;line-height:1.1}
.progreso-general .detalle{color:#666;font-size:.8rem;margin-top:4px}
.barra-general{height:10px;background:#e9ecef;border-radius:10px;overflow:hidden;margin-top:10px}
.barra-general .relleno{height:100%;width:0%;background:#007bff;border-radius:10px;transition:width .35s ease}
.lista-progreso{display:flex;flex-direction:column;gap:10px}
.fila-progreso.bloqueada{opacity:.45}.fila-progreso{display:grid;grid-template-columns:55px 1fr 58px;align-items:center;gap:8px}
.nombre-linea{font-weight:bold;font-size:.85rem;color:#333;text-align:left}
.barra-linea{height:12px;background:#e9ecef;border-radius:10px;overflow:hidden}
.barra-linea .relleno{height:100%;width:0%;background:#28a745;border-radius:10px;transition:width .35s ease}
.valor-progreso{font-size:.8rem;font-weight:bold;color:#555;text-align:right}
.sin-datos{color:#888;font-size:.8rem;text-align:center;padding:8px}
.contenedor-internos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.interno{background:white;border:2px solid #ccc;border-radius:8px;padding:15px 5px;font-size:1.1rem;font-weight:bold;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:70px;box-shadow:0 2px 4px rgba(0,0,0,.05);-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.interno.descargado{background:#28a745!important;color:white;border-color:#1e7e34}
.interno.con-mensaje{background:#f59d00!important;color:white;border-color:#d47f00}
.interno.descargado.con-mensaje{background:#f59d00!important;border-color:#d47f00}
.nota-indicador{font-size:.65rem;color:#666;font-weight:normal;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.interno.descargado .nota-indicador{color:#e2fcd4}
.interno.con-mensaje .nota-indicador{color:white;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mensaje-estado{color:#666;font-style:italic;margin-top:20px;grid-column:span 4}
#boton-volver{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:#007bff;color:white;font-size:30px;line-height:56px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:1000;display:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .15s}
#boton-volver:active{transform:scale(.9);background:#0056b3}
@media(max-width:360px){.contenedor-internos{grid-template-columns:repeat(3,1fr)}.mensaje-estado{grid-column:span 3}.fila-progreso{grid-template-columns:48px 1fr 52px;gap:6px}.valor-progreso{font-size:.75rem}}
#reinicio-panel{margin:16px auto;text-align:center}#reinicio-opciones{display:none;margin:10px auto;padding:12px;background:white;border-radius:8px;max-width:420px}#reinicio-panel button,#reinicio-panel select{padding:10px;margin:5px;border-radius:7px;cursor:pointer}#reinicio-panel button{background:#a83232;color:white;border:0}
.fila-progreso.completa .barra-linea .relleno{background:#ffc400}.fila-progreso.completa .valor-progreso{color:#c18b00;font-weight:900}
#exportar-pdf{display:block;margin:18px auto 24px;padding:13px 22px;background:#176b48;color:white;border:0;border-radius:9px;font-weight:bold;font-size:1rem;cursor:pointer}#exportar-pdf:disabled{opacity:.55;cursor:wait}
#compartir-pdf{display:block;margin:0 auto 24px;padding:13px 22px;background:#25d366;color:#083c22;border:0;border-radius:9px;font-size:1rem;font-weight:bold;cursor:pointer}#compartir-pdf:disabled{opacity:.5}

<script>
const firebaseConfig={apiKey:"AIzaSyBdYu1yjsshw0lXXQ9PRlN-hPEHB6tjNF4",authDomain:"tarifas-compartidas.firebaseapp.com",databaseURL:"https://tarifas-compartidas-default-rtdb.firebaseio.com",projectId:"tarifas-compartidas",storageBucket:"tarifas-compartidas.firebasestorage.app",messagingSenderId:"943166246045",appId:"1:943166246045:web:f0df71d42acf52ebf15874",measurementId:"G-TXK4ZW38ZK"};
firebase.initializeApp(firebaseConfig);const database=firebase.database();let referenciaEstados=null;let lineaActual=null;
const lineasProgreso=['271','373','384','177','263','79','514','varela'];
const nombresLineas={'271':'271','373':'373','384':'384','177':'177','263':'263','79':'79','514':'514','varela':'Varela'};
const datosProgreso={};const referenciasProgreso={};const lineasBloqueadas={};const referenciaBloqueos=database.ref("configuracion/lineasBloqueadas");
referenciaBloqueos.on("value",snapshot=>{const valores=snapshot.val()||{};lineasProgreso.forEach(linea=>lineasBloqueadas[linea]=valores[linea]===true);document.querySelectorAll(".btn-linea").forEach(btn=>{const linea=btn.dataset.linea;btn.classList.toggle("bloqueada",!!lineasBloqueadas[linea]);btn.textContent=(lineasBloqueadas[linea]?"🔒 ":"")+nombresLineas[linea]});lineasProgreso.forEach(linea=>actualizarProgresoLinea(linea));actualizarProgresoGeneral()});
function configurarBotonesLineas(){document.querySelectorAll(".btn-linea").forEach(btn=>{const linea=btn.getAttribute("onclick").match(/cargarLinea\(\x27([^\x27]+)/)[1];btn.dataset.linea=linea;btn.removeAttribute("onclick");let temporizador=null;let largo=false;let inicio=null;const cancelar=()=>{clearTimeout(temporizador);temporizador=null};btn.addEventListener("pointerdown",e=>{if(e.button!==0)return;largo=false;inicio={x:e.clientX,y:e.clientY};cancelar();temporizador=setTimeout(()=>{largo=true;alternarBloqueoLinea(linea)},1500)});btn.addEventListener("pointermove",e=>{if(inicio&&Math.hypot(e.clientX-inicio.x,e.clientY-inicio.y)>12)cancelar()});btn.addEventListener("pointerup",cancelar);btn.addEventListener("pointercancel",cancelar);btn.addEventListener("pointerleave",cancelar);btn.addEventListener("contextmenu",e=>e.preventDefault());btn.addEventListener("click",e=>{if(largo){e.preventDefault();largo=false;return}cargarLinea(linea,btn)})})}
function alternarBloqueoLinea(linea){referenciaBloqueos.child(linea).transaction(valor=>valor===true?null:true).catch(error=>{console.error(error);alert("No se pudo cambiar el bloqueo de la línea.")})}

const referenciaConexion=database.ref('.info/connected');
referenciaConexion.on('value',snapshot=>{const conectado=snapshot.val()===true;const indicador=document.getElementById('estado-conexion');const texto=document.getElementById('texto-conexion');if(conectado){indicador.classList.remove('desconectado');indicador.classList.add('conectado');texto.innerText='Conectado'}else{indicador.classList.remove('conectado');indicador.classList.add('desconectado');texto.innerText='Sin conexión'}});
function iniciarProgreso(){const lista=document.getElementById('lista-progreso');lista.innerHTML='';lineasProgreso.forEach(linea=>{datosProgreso[linea]={total:0,completados:0,listaCargada:false};const fila=document.createElement('div');fila.className='fila-progreso';fila.id=`progreso-${linea}`;fila.innerHTML=`<div class="nombre-linea">${nombresLineas[linea]}</div><div class="barra-linea"><div class="relleno"></div></div><div class="valor-progreso">0%</div>`;lista.appendChild(fila);fetch(`lineas/${linea}.txt`).then(response=>{if(!response.ok)throw new Error(`No se encontró lineas/${linea}.txt`);return response.text()}).then(texto=>{const internos=texto.split('\n').map(valor=>valor.trim()).filter(valor=>valor.length>0);datosProgreso[linea].total=internos.length;datosProgreso[linea].listaCargada=true;actualizarProgresoLinea(linea);actualizarProgresoGeneral()}).catch(error=>{console.error(`Error cargando progreso de ${linea}:`,error);datosProgreso[linea].listaCargada=true;actualizarProgresoLinea(linea);actualizarProgresoGeneral()});referenciasProgreso[linea]=database.ref(`estados/${linea}`);referenciasProgreso[linea].on('value',snapshot=>{const estados=snapshot.val()||{};datosProgreso[linea].completados=Object.values(estados).filter(estado=>estado&&(estado.descargado===true||String(estado.nota||'').trim().length>0)).length;actualizarProgresoLinea(linea);actualizarProgresoGeneral()})})}
function actualizarProgresoLinea(linea){const datos=datosProgreso[linea];const fila=document.getElementById(`progreso-${linea}`);if(!fila||!datos||!datos.listaCargada)return;fila.classList.toggle('bloqueada',!!lineasBloqueadas[linea]);fila.classList.toggle('completa',datos.total>0&&datos.completados>=datos.total&&!lineasBloqueadas[linea]);const porcentaje=datos.total>0?Math.round(datos.completados/datos.total*100):0;const porcentajeLimitado=Math.min(100,porcentaje);fila.querySelector('.relleno').style.width=`${porcentajeLimitado}%`;fila.querySelector('.valor-progreso').textContent=lineasBloqueadas[linea]?'🔒':`${porcentajeLimitado}%`;fila.title=`${datos.completados} de ${datos.total} internos actualizados`}
function actualizarProgresoGeneral(){let total=0;let completados=0;let listasCargadas=0;lineasProgreso.forEach(linea=>{const datos=datosProgreso[linea];if(!datos)return;if(datos.listaCargada)listasCargadas++;if(!lineasBloqueadas[linea]){total+=datos.total;completados+=Math.min(datos.completados,datos.total)}});if(listasCargadas<lineasProgreso.length){document.getElementById('progreso-general-detalle').textContent='Calculando líneas...';return}const porcentaje=total>0?Math.round(completados/total*100):0;document.getElementById('progreso-general-porcentaje').textContent=`${porcentaje}%`;document.getElementById('progreso-general-detalle').textContent=`${completados} de ${total} internos actualizados (faltan ${Math.max(0,total-completados)} coches)`;document.getElementById('barra-general-relleno').style.width=`${Math.min(100,porcentaje)}%`}
function cargarLinea(linea,botonElemento){document.getElementById('acciones-informes').style.display='none';lineaActual=linea;localStorage.setItem('ultimaLinea',linea);document.getElementById('titulo-vista').innerText=`Cargando Línea ${linea.toUpperCase()}...`;document.querySelectorAll('.btn-linea').forEach(btn=>btn.classList.remove('activo'));botonElemento.classList.add('activo');document.getElementById('boton-volver').style.display='block';document.getElementById('panel-progreso').style.display='none';const contenedor=document.getElementById('panel-internos');contenedor.innerHTML=`<div class="mensaje-estado">Buscando archivo lineas/${linea}.txt...</div>`;if(referenciaEstados){referenciaEstados.off();referenciaEstados=null}fetch(`lineas/${linea}.txt`).then(response=>{if(!response.ok)throw new Error(`No se encontró el archivo de la línea ${linea}`);return response.text()}).then(texto=>{document.getElementById('titulo-vista').innerText=`Línea ${linea.toUpperCase()}`;contenedor.innerHTML='';const internos=texto.split('\n').map(valor=>valor.trim()).filter(valor=>valor.length>0);if(internos.length===0){contenedor.innerHTML=`<div class="mensaje-estado">El archivo de la línea ${linea} está vacío.</div>`;return}internos.forEach(num=>{const div=document.createElement('div');div.className='interno';div.setAttribute('data-interno',num);div.innerHTML=`<span>${num}</span><div class="nota-indicador"></div>`;configurarEventosToque(div,linea,num);contenedor.appendChild(div)});referenciaEstados=database.ref(`estados/${linea}`);referenciaEstados.on('value',snapshot=>{const estados=snapshot.val()||{};internos.forEach(num=>{const elemento=contenedor.querySelector(`.interno[data-interno="${CSS.escape(num)}"]`);if(!elemento)return;const estado=estados[num]||{descargado:false,nota:""};const mensaje=(estado.nota||'').trim();elemento.classList.toggle('descargado',!!estado.descargado);elemento.classList.toggle('con-mensaje',!!mensaje);elemento.querySelector('.nota-indicador').textContent=mensaje})},error=>console.error('Error Firebase:',error))}).catch(error=>{document.getElementById('titulo-vista').innerText='Error';contenedor.innerHTML=`<div class="mensaje-estado" style="color:red;">⚠️ Error al cargar la línea ${linea}.<br><br>Asegurate de que exista en la carpeta "lineas".</div>`;console.error(error)})}
function configurarEventosToque(elemento,linea,interno){let tiempoPresionado;let ultimoTap=0;let dobleTapBloqueado=false;elemento.addEventListener('touchstart',()=>{tiempoPresionado=setTimeout(()=>alternarDescarga(linea,interno),600)},{passive:true});elemento.addEventListener('touchmove',()=>clearTimeout(tiempoPresionado),{passive:true});elemento.addEventListener('touchend',e=>{clearTimeout(tiempoPresionado);const ahora=Date.now();if(ahora-ultimoTap<350){e.preventDefault();dobleTapBloqueado=true;ultimoTap=0;editarMensaje(linea,interno);setTimeout(()=>dobleTapBloqueado=false,50)}else ultimoTap=ahora},{passive:false});elemento.addEventListener('touchcancel',()=>clearTimeout(tiempoPresionado),{passive:true});elemento.addEventListener('dblclick',e=>{e.preventDefault();editarMensaje(linea,interno)});elemento.addEventListener('click',e=>e.preventDefault())}
function editarMensaje(linea,interno){const referencia=database.ref(`estados/${linea}/${interno}`);referencia.once('value').then(snapshot=>{const estado=snapshot.val()||{descargado:false,nota:""};const mensaje=prompt(`Mensaje para el interno ${interno}:`,estado.nota||'');if(mensaje===null)return;const texto=mensaje.trim();return referencia.transaction(estadoActual=>{const actual=estadoActual||{descargado:false,nota:""};return{descargado:!!actual.descargado,nota:texto}})}).then(resultado=>{if(resultado)console.log(`Mensaje del interno ${interno} actualizado`)}).catch(error=>{console.error('Error guardando mensaje:',error);alert('No se pudo guardar el mensaje.')})}
function alternarDescarga(linea,interno){const referencia=database.ref(`estados/${linea}/${interno}`);referencia.transaction(estadoActual=>{const estado=estadoActual||{descargado:false,nota:""};return{descargado:!estado.descargado,nota:estado.nota||""}}).then(()=>console.log(`Interno ${interno} actualizado`)).catch(error=>{console.error('Error guardando:',error);alert('No se pudo guardar el cambio.')})}
async function cargarMotorPDF(){
const cargar=url=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=resolve;script.onerror=()=>reject(new Error('No se pudo cargar '+url));document.head.appendChild(script)});
if(!window.jspdf?.jsPDF){try{await cargar('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js')}catch(error){await cargar('https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js')}}
if(!window.jspdf?.jsPDF)throw new Error('jsPDF no disponible');
if(typeof window.jspdf.jsPDF.API.autoTable!=='function'){try{await cargar('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js')}catch(error){await cargar('https://unpkg.com/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js')}}
if(typeof window.jspdf.jsPDF.API.autoTable!=='function')throw new Error('Generador de tablas no disponible');
}
async function exportarComentariosPDF(compartir=false){
const boton=document.getElementById(compartir?'compartir-pdf':'exportar-pdf');boton.disabled=true;const textoBoton=boton.textContent;boton.textContent='Preparando PDF...';
try{
await cargarMotorPDF();
const snapshot=await database.ref('estados').once('value');const estados=snapshot.val()||{};const filas=[];
for(const linea of lineasProgreso){if(lineasBloqueadas[linea])continue;const internos=estados[linea]||{};for(const [interno,estado] of Object.entries(internos)){const nota=String((estado&&estado.nota)||'').trim();if(nota)filas.push([nombresLineas[linea],interno,nota])}}
filas.sort((a,b)=>lineasProgreso.indexOf(a[0].toLowerCase())-lineasProgreso.indexOf(b[0].toLowerCase())||a[1].localeCompare(b[1],undefined,{numeric:true}));
if(!filas.length){alert('No hay coches con comentarios para exportar.');return}
let doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
const fecha=new Date();const fechaTexto=fecha.toLocaleString('es-AR');
doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Cabecera Carlan - Observaciones',14,18);
doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Generado: '+fechaTexto,14,25);doc.text('Colectivos con comentarios: '+filas.length,14,31);
const tablaOpciones={startY:34,head:[['Línea','Interno','Comentario']],body:filas,theme:'grid',styles:{fontSize:8,cellPadding:1,overflow:'linebreak'},headStyles:{fillColor:[35,80,115]},columnStyles:{0:{cellWidth:19},1:{cellWidth:19}},margin:{left:10,right:10,top:10,bottom:8}};
let cabeEnUnaHoja=false;
for(const horizontal of [false,true]){
for(const tam of [9,8,7,6,5,4]){
const prueba=new window.jspdf.jsPDF({orientation:horizontal?'landscape':'portrait',unit:'mm',format:'a4'});
prueba.setFont('helvetica','bold');prueba.setFontSize(15);prueba.text('Cabecera Carlan - Observaciones',10,15);
prueba.setFont('helvetica','normal');prueba.setFontSize(9);prueba.text('Generado: '+fechaTexto+' | Colectivos con comentarios: '+filas.length,10,22);
prueba.autoTable({...tablaOpciones,startY:27,styles:{fontSize:tam,cellPadding:tam<=6?0.6:1,overflow:'linebreak'}});
if(prueba.internal.getNumberOfPages()===1){doc=prueba;cabeEnUnaHoja=true;break}
}
if(cabeEnUnaHoja)break;
}
if(!cabeEnUnaHoja)throw new Error('Demasiadas observaciones para una sola hoja A4');
const nombre='Actualizacion de tarifas Cabecera Carlan '+String(fecha.getDate()).padStart(2,'0')+'-'+String(fecha.getMonth()+1).padStart(2,'0')+'-'+fecha.getFullYear()+'.pdf';if(compartir){const archivo=new File([doc.output('blob')],nombre,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[archivo]})&&navigator.share){await navigator.share({files:[archivo],title:'Cabecera Carlan - Observaciones'});}else{doc.save(nombre);alert('El navegador no permite compartir el PDF directamente. Se descargó para que lo adjuntes en WhatsApp.')}}else{doc.save(nombre)}
}catch(error){console.error('Error al exportar PDF:',error);alert('Error PDF: '+(error.message||String(error)))}
finally{boton.disabled=false;boton.textContent=textoBoton}
}
function compartirComentariosPDF(){return exportarComentariosPDF(true)}
async function reiniciarChequeo(){const linea=document.getElementById('reinicio-linea').value;const nombre=linea?'línea '+linea:'TODAS LAS LÍNEAS';const clave=prompt('Clave para reiniciar '+nombre+':');if(clave===null)return;if(clave!=='2639'){alert('Clave incorrecta');return}if(!confirm('¿Confirmás borrar las marcas y observaciones de '+nombre+' en todos los dispositivos?'))return;const boton=document.getElementById('reinicio-confirmar');boton.disabled=true;try{await database.ref(linea?'estados/'+linea:'estados').remove();alert('Registros reiniciados');document.getElementById('reinicio-opciones').style.display='none'}catch(e){console.error(e);alert('Error al borrar registros. Revisá los permisos de Firebase.')}finally{boton.disabled=false}}
function volverAlMenu(){document.getElementById('acciones-informes').style.display='block';if(referenciaEstados){referenciaEstados.off();referenciaEstados=null}lineaActual=null;localStorage.removeItem('ultimaLinea');document.getElementById('titulo-vista').innerText='Seleccione una Línea';document.querySelectorAll('.btn-linea').forEach(btn=>btn.classList.remove('activo'));document.getElementById('panel-internos').innerHTML='<div class="mensaje-estado">Ninguna línea seleccionada</div>';document.getElementById('panel-progreso').style.display='block';document.getElementById('boton-volver').style.display='none'}
window.addEventListener('load',()=>{configurarBotonesLineas();iniciarProgreso();const ultimaLinea=localStorage.getItem('ultimaLinea');if(!ultimaLinea)return;const boton=Array.from(document.querySelectorAll('.btn-linea')).find(btn=>btn.innerText.trim().toLowerCase()===ultimaLinea.toLowerCase());if(boton)cargarLinea(ultimaLinea,boton)})
</script>
